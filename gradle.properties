org.jetbrains.compose.experimental.jscanvas.enabled=true
org.jetbrains.compose.experimental.macos.enabled=true
# 512m metaspace ran out during the Android release build (AGP + KMP + Compose in one daemon).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
kotlin.native.jvmArgs=-Xmx8g

# Compose Multiplatform pulls androidx.annotation / collection / lifecycle into every target,
# including the Kotlin/Native ones, so AGP's AndroidX check trips unless this is set.
android.useAndroidX=true
