<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NaHAL</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        #ComposeTarget { width: 100%; height: 100%; outline: none; }
    </style>
    <!--
      No skiko.js bootstrap here, unlike the JS bundle: Compose's wasm runtime loads and
      initialises Skia itself, and the generated ui.js is an ES module that awaits the wasm
      instantiation before calling main(). Loading it as a classic script would run main()
      before the module is ready.
    -->
    <script type="application/javascript" src="ui.js"></script>
</head>
<body>
    <canvas id="ComposeTarget"></canvas>
</body>
</html>
